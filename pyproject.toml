[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "write2solve"
version = "0.1.0"
description = "Math game where you answer equations with your own handwriting."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pygame",
    "numpy",
    "tensorflow",
]

[project.scripts]
write2solve = "main:main"

[tool.setuptools]
py-modules = ["main", "equation_generation"]

